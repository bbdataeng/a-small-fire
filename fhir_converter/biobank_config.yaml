# Configuration File for Biobank and Collection Information

BBMRI_STRUCTURE_DEFINITION_URL: "https://fhir.bbmri.de/StructureDefinition"

# URL of the local server *
SERVER_URL: "https://localhost/bbmri-localdatamanagement/fhir"

# ---------------------------- Biobank Info --------------------------------- #

# Unique ID for the biobank *
BIOBANK_ID: BBX

# ID used to identify the biobank in the BBMRI-ERIC directory *
BIOBANK_DIRECTORY_ID: bbmri-eric:ID:IT_1234

# Full name of the biobank *
BIOBANK_NAME: Biobanca Di Ricerca X

# Alternate name(s) or abbreviations used for the biobank (can be empty)
BIOBANK_ALIAS: [BB-X]

# A brief description of the biobank * 
BIOBANK_DESCRIPTION: >-
  BB Research Biobank stores biological samples and associated data of
  ...

# The legal entity responsible for the biobank *
BIOBANK_JURIDICALPERSON: IRCCS Ospedale X

# Location information for the biobank *
BIOBANK_CITY: Rome
BIOBANK_LINE: []
BIOBANK_POSTAL_CODE: 
BIOBANK_COUNTRY: IT

# -------------------------------- Contact Info ----------------------------- #

# Contact details for the biobank director (primary contact person)
DIRECTOR_FAMILY_NAME: Cognome
DIRECTOR_GIVEN_NAME: [Nome]
DIRECTOR_PREFIX_NAME: []  # Professional title or prefix (e.g., Dr, Prof.)
DIRECTOR_PHONE: 
DIRECTOR_EMAIL: nome.cognome@x.net

# Contact details for a secondary point of contact (Research contact) *
CONTACT_FAMILY_NAME: Cognome
CONTACT_GIVEN_NAME: [Nome]
CONTACT_PREFIX_NAME: []
CONTACT_PHONE: 
CONTACT_EMAIL: nome.cognome@x.net
# Address details for the research contact (could be the same as biobank location) *
CONTACT_ADD_CITY: Rome
CONTACT_ADD_LINE: []
CONTACT_ADD_POSTAL_CODE: 
CONTACT_ADD_COUNTRY: IT

# -------------------------------- Collection Info -------------------------- #

# Unique identifier for the collection
COLLECTION_ID: NND

# Collection identifier used in the BBMRI-ERIC directory *
COLLECTION_DIRECTORY_ID: bbmri-eric:ID:IT_1234:collection:0000

# Name of the collection *
COLLECTION_NAME: Neurodegenerative and Neuromuscular Diseases

# Alternate name or short name for the collection * 
COLLECTION_ALIAS: NND

# A brief description of the collection *
COLLECTION_DESCRIPTION: >-
  BB-X Research Biobank stores biological samples and associated data of
  ...

# Type of the collection and category code
COLLECTION_TYPE_CODE: SAMPLE                
DATA_CATEGORY_CODE: BIOLOGICAL_SAMPLES

# *mandatory fields